    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0D0D0F" />
    <script>
      (function () {
        var locale = "en";
        var theme = "dark";
        var forced = null;
        try {
          var queryTheme = new URLSearchParams(window.location.search).get("theme");
          if (queryTheme === "light" || queryTheme === "dark") forced = queryTheme;
        } catch (e) {}
        try {
          var storedLocale = localStorage.getItem("locale");
          var storedTheme = localStorage.getItem("theme");
          if (storedLocale === "ru" || storedLocale === "en") {
            locale = storedLocale;
          } else {
            var language = (navigator.language || "").toLowerCase();
            locale = language.indexOf("ru") === 0 ? "ru" : "en";
          }
          if (forced) {
            theme = forced;
          } else if (storedTheme === "light" || storedTheme === "dark") {
            theme = storedTheme;
          } else if (window.matchMedia("(prefers-color-scheme: light)").matches) {
            theme = "light";
          }
        } catch (e) {
          if (forced) theme = forced;
        }
        var root = document.documentElement;
        root.lang = locale;
        root.dataset.theme = theme;
        root.style.colorScheme = theme;
        var themeColor = document.querySelector('meta[name="theme-color"]');
        if (themeColor) themeColor.setAttribute("content", theme === "light" ? "#F4F4F0" : "#0D0D0F");
      })();
    </script>
